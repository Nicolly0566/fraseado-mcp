services:
  - type: web
    name: fraseado-mcp
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FRASEADO_LOGIN_PASSWORD
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: MAX_INPUT_MB
        value: '50'
      - key: MAX_CONCURRENT_TRANSCRIPTIONS
        value: '1'
      - key: NODE_ENV
        value: production
